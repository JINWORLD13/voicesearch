services:
  - type: web
    name: voicesearch
    runtime: node
    plan: free
    # NODE_ENV=production 상태에서 npm install만 하면 devDependencies(vite, typescript,
    # @types/* 등 빌드 도구)가 빠져서 tsc/vite build가 깨진다. --include=dev로 강제 설치.
    buildCommand: cd web && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
